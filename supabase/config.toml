# Configuración de Supabase para desarrollo local y CI (`supabase start`).
# En el proyecto en la nube, estos mismos valores se configuran en el panel
# (ver docs/CONFIGURACION.md).

project_id = "portal-raciones-kw"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Nadie se registra solo: las cuentas las crea el administrador.
enable_signup = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Restablece tu contraseña · Portal de Raciones KW"
content_path = "./supabase/templates/recuperar.html"

[auth.email.template.invite]
subject = "Te damos la bienvenida al Portal de Raciones KW"
content_path = "./supabase/templates/invitacion.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "12h0m0s"
inactivity_timeout = "2h0m0s"
